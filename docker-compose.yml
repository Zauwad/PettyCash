version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: oms_mysql
    restart: always
    environment:
      MYSQL_DATABASE: oms_db
      MYSQL_USER: oms_user
      MYSQL_PASSWORD: oms_password
      MYSQL_ROOT_PASSWORD: oms_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.0-alpine
    container_name: oms_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data:
